<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idol Database</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://i.pinimg.com/originals/e1/85/86/e1858670b123b2df3f43f44228a3d2cd.gif"
    />
  </head>
  <body>
    <header>
      <h1>Idol Database</h1>
      <img
        src="https://i.pinimg.com/originals/f3/f7/13/f3f71321b9b288f5fd84a59a8a4c0cbd.gif"
        alt="Gif illit"
        width="300"
      />
      <h2>Agrega la Photocard de tu Idol Fav</h2>
    </header>

    <nav>
      <form class="d-flex" role="search">
        <a>
          <img
            src="assets/img/logo-navbar.png"
            alt="Logo Navbar"
            width="80"
            height="80"
        /></a>
        <input
          class="form-control"
          type="search"
          id="inputBuscador"
          placeholder="Buscador"
        />
        <button class="btn" id="btnBuscador">
          <img
            src="assets/img/logo-buscador.png"
            alt="Logo Buscador"
            width="80"
            height="80"
          />
        </button>
      </form>
    </nav>

    <main>
      <section id="seccionAgregar">
        <h2>Agrega un idol</h2>
        <form>
          <label class="form-label" for="nombreIdol">Nombre</label>
          <input type="text" id="nombreIdol" />

          <label class="form-label" for="imagenIdol">Photocard (URL)</label>
          <input type="text" id="imagenIdol" />

          <label class="form-label" for="eraIdol">Photocard Era</label>
          <input type="text" id="eraIdol" />

          <button class="btn btn-agregar" type="submit">Agregar</button>
        </form>
      </section>

      <section id="seccionGaleria">
        <button class="btn btn-ver" id="btnGaleria">Ver Photocards</button>
        <div class="row" id="rowGaleria"></div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/script.js"></script>

    <footer>
      <p>&copy Derechos Reservados a Chocovani</p>
      <img
        src="https://i.pinimg.com/originals/e1/85/86/e1858670b123b2df3f43f44228a3d2cd.gif"
        width="60"
        alt="Gif footer"
      />
    </footer>
  </body>
</html>
